# 모놀리식 2차 배포
# Frontend HTML/CSS/JS도 Spring Boot 이미지 안에 포함되므로 별도 Frontend Pod/Service가 필요 없다.
# 모든 요청을 하나의 ordersystem-backend-service로 전달한다.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-backend-ingress
  namespace: soldesk
  annotations:
    cert-manager.io/cluster-issuer: my-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - server.aws-esk.com
      secretName: server-aws-esk-com-tls
  rules:
    - host: server.aws-esk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ordersystem-backend-service
                port:
                  number: 80
