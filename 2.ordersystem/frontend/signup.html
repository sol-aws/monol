<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 | Soldesk Shop</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Soldesk Shop</a>
  <nav><a href="/">상품</a><a href="/login.html">로그인</a></nav>
</header>

<main class="form-page">
  <section class="form-card">
    <h1>회원가입</h1>
    <p class="muted">가입한 계정으로 로그인할 수 있습니다.</p>
    <form id="signupForm">
      <label>이름<input name="name" required /></label>
      <label>이메일<input name="email" type="email" required /></label>
      <label>비밀번호<input name="password" type="password" minlength="4" required /></label>
      <button type="submit">회원가입</button>
    </form>
    <div id="message" class="message hidden"></div>
  </section>
</main>

<script src="/common.js"></script>
<script src="/signup.js"></script>
</body>
</html>
