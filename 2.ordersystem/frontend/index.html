<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soldesk Shop</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Soldesk Shop</a>
  <nav>
    <a href="/">상품</a>
    <a id="registerLink" href="/product-register.html">상품등록</a>
    <a id="loginLink" href="/login.html">로그인</a>
    <a id="signupLink" href="/signup.html">회원가입</a>
    <button id="logoutButton" class="link-button hidden" type="button">로그아웃</button>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <p class="eyebrow">EKS 2차 배포 실습</p>
    <h1>등록된 상품을 확인하고 주문해보세요.</h1>
    <p>회원가입과 로그인 후 상품등록과 주문 기능을 사용할 수 있습니다.</p>
  </section>

  <section>
    <div class="section-title">
      <div>
        <h2>상품 목록</h2>
        <p id="loginState" class="muted"></p>
      </div>
      <button id="refreshButton" class="secondary" type="button">새로고침</button>
    </div>
    <div id="message" class="message hidden"></div>
    <div id="productGrid" class="product-grid"></div>
  </section>
</main>

<script src="/common.js"></script>
<script src="/shop.js"></script>
</body>
</html>
