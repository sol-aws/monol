<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품등록 | Soldesk Shop</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Soldesk Shop</a>
  <nav><a href="/">상품</a><button id="logoutButton" class="link-button" type="button">로그아웃</button></nav>
</header>

<main class="form-page">
  <section class="form-card wide">
    <h1>상품등록</h1>
    <p class="muted">상품 이미지는 S3에 저장되고 상품 정보는 RDS에 저장됩니다.</p>
    <form id="productForm" enctype="multipart/form-data">
      <label>상품명<input name="name" required /></label>
      <label>카테고리<input name="category" placeholder="예: 전자제품" required /></label>
      <label>가격<input name="price" type="number" min="0" required /></label>
      <label>재고수량<input name="stockQuantity" type="number" min="0" required /></label>
      <label>상품 이미지<input name="image" type="file" accept="image/*" required /></label>
      <button type="submit">상품등록</button>
    </form>
    <div id="message" class="message hidden"></div>
  </section>
</main>

<script src="/common.js"></script>
<script src="/product-register.js"></script>
</body>
</html>
