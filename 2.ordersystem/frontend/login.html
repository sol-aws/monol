<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | Soldesk Shop</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Soldesk Shop</a>
  <nav><a href="/">상품</a><a href="/signup.html">회원가입</a></nav>
</header>

<main class="form-page">
  <section class="form-card">
    <h1>로그인</h1>
    <p class="muted">상품등록과 주문은 로그인한 사용자만 가능합니다.</p>
    <form id="loginForm">
      <label>이메일<input name="email" type="email" required /></label>
      <label>비밀번호<input name="password" type="password" required /></label>
      <button type="submit">로그인</button>
    </form>
    <div id="message" class="message hidden"></div>
  </section>
</main>

<script src="/common.js"></script>
<script src="/login.js"></script>
</body>
</html>
