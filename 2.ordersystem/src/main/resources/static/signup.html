<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 | Soldesk Market</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="nav-shell">
    <a class="brand" href="/"><span class="brand-mark">S</span><span>Soldesk Market</span></a>
    <nav class="main-nav"><a href="/">상품목록</a><a href="/product-register.html">상품등록</a><a href="/login.html">로그인</a></nav>
  </div>
</header>
<main class="form-page">
  <section class="form-card">
    <p class="section-kicker">CREATE ACCOUNT</p>
    <h1>회원가입</h1>
    <p class="muted">가입한 이메일과 비밀번호로 바로 로그인할 수 있습니다.</p>
    <form id="signupForm">
      <label>이름<input name="name" maxlength="50" autocomplete="name" required /></label>
      <label>이메일<input name="email" type="email" autocomplete="email" required /></label>
      <label>비밀번호<input name="password" type="password" minlength="4" autocomplete="new-password" required /></label>
      <button class="form-submit" type="submit">회원가입</button>
    </form>
    <div id="message" class="message hidden"></div>
    <p class="form-links">이미 계정이 있다면 <a href="/login.html">로그인</a></p>
  </section>
</main>
<script src="/common.js"></script>
<script src="/signup.js"></script>
</body>
</html>
