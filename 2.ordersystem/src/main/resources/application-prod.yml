spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # DB_HOST는 k8s의 Secret 내의 Key이름과 일치
    url: jdbc:mysql://${DB_HOST}:3306/ordersystem?useSSL=false&allowPublicKeyRetrieval=true
    username: admin
    password: ${DB_PW}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    # 2차 배포부터는 애플리케이션 재시작 시 기존 Table을 삭제/재생성하지 않는다.
    # ddl-auto 설정 자체를 사용하지 않고 DB Schema는 직접 관리한다.
    show_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# S3 Bucket 이름과 Region은 Kubernetes ConfigMap의 환경변수로 주입한다.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET}

