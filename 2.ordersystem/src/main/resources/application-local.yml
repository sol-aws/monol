spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ordersystem?useSSL=false&allowPublicKeyRetrieval=true
    # url: jdbc:mysql://host.docker.internal:3306/ordersystem?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    # Table 생성/삭제는 애플리케이션이 자동으로 수행하지 않는다.
    show_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:local-product-image-bucket}

