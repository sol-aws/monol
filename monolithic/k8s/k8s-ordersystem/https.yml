apiVersion: cert-manager.io/v1
kind: ClusterIssuer

metadata:
  # ClusterIssuer 이름
  # Certificate에서 issuerRef.name으로 이 이름을 참조한다.
  name: my-issuer

spec:
  # ACME(Automatic Certificate Management Environment) 방식으로 인증서를 자동 발급하도록 설정
  acme:
    # Let's Encrypt의 실제 인증서 발급 서버 주소
    # 이 주소를 사용하면 실제 브라우저에서 신뢰할 수 있는 인증서가 발급된다.
    server: https://acme-v02.api.letsencrypt.org/directory

    # Let's Encrypt 계정 등록에 사용할 이메일 주소 (인증서 관련 알림이나 계정 관련 연락에 사용)
    email: konan7979@gmail.com

    # Let's Encrypt ACME 계정에서 사용할 Private Key를 저장할 Secret 설정
    # 사용자가 미리 Secret을 만드는 것이 아니라 cert-manager가 자동으로 생성하고 관리한다.
    privateKeySecretRef:
      # ACME 계정용 Private Key가 저장될 Secret 이름
      name: my-issuer

    # 도메인 소유권을 어떤 방식으로 검증할지 설정
    solvers:
      # HTTP-01 Challenge 방식을 사용
      # Let's Encrypt가 HTTP 요청을 보내서 해당 도메인을 실제로 제어하고 있는지 확인한다.
      - http01:
          # HTTP-01 검증 요청을 처리할 Ingress 설정
          ingress:
            # nginx Ingress Controller를 사용하여 Let's Encrypt의 도메인 검증 요청을 처리한다.
            class: nginx

---
# 실제 TLS 인증서 발급을 요청하는 Certificate 리소스
apiVersion: cert-manager.io/v1
kind: Certificate

metadata:
  # Certificate 리소스 이름(개별 변경)
  name: server-aws-esk-com-tls

  # 인증서와 TLS Secret을 생성할 namespace
  namespace: soldesk

spec:
  # 발급된 인증서와 Private Key를 저장할 Kubernetes Secret 이름
  # 인증서 발급이 완료되면 cert-manager가 자동으로 다음 Secret을 생성한다.
  # server-aws-esk-com-tls
  #
  # Secret 내부에는 일반적으로 다음 정보가 저장된다.
  # tls.crt = TLS 인증서
  # tls.key = 인증서의 Private Key
  # ingress.yml의 secretName과 동일해야한다.
  secretName: server-aws-esk-com-tls

  # 인증서 유효기간
  # 2160시간 = 90일
  duration: 2160h

  # 인증서 만료 전에 갱신을 시작할 시점
  # 360시간 = 15일
  # 즉 인증서 만료 15일 전부터 cert-manager가 자동 갱신을 시도한다.
  renewBefore: 360h

  # 어떤 Issuer를 사용해서 인증서를 발급받을지 지정
  issuerRef:
    # 위에서 생성한 ClusterIssuer 이름
    name: my-issuer

    # 일반 Issuer가 아니라 클러스터 전체에서 사용할 수 있는 ClusterIssuer를 사용
    kind: ClusterIssuer

  # 인증서의 대표 도메인 이름
  commonName: server.aws-esk.com

  # 인증서에 포함할 도메인 목록
  # 브라우저가 https://server.aws-esk.com 으로 접속하면
  # 인증서의 dnsNames와 현재 접속한 도메인이 일치하는지 확인한다.
  # 추가 서브도메인의 인증서가 필요한 경우 아래에 계속 추가할 수 있다.
  dnsNames:
    - server.aws-esk.com
